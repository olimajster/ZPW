    <script>

        // $(document).on("keypress keyup keydown", function(event){

        // })

        // $(document).on("mousemove", function(event){
        //     $("#pageX").text(event.pageX)
        //     $("#pageY").text(event.pageY)
        // })

        $(function(){
            $("#japuszko").css("margin-left", Math.floor((Math.random() * 500) + 1))
            $("#japuszko").css("margin-top", Math.floor((Math.random() * 500) + 1))
        })

        let position = 0;
        $(document).on("keypress", function(event){
            if(event.key === "a"){
                position -= 1
                $("#kwadrat").css("margin-left", position + "px")
            }
            
            if(event.key === "d"){
                position += 1
                $("#kwadrat").css("margin-left", position + "px")
            }

            if(event.key === "w"){
                position -= 1
                $("#kwadrat").css("margin-top", position + "px")
            }

            if(event.key === "s"){
                position += 1
                $("#kwadrat").css("margin-top", position + "px")
            }
        })
    </script>

    <style>
        #kwadrat {
            width: 200px;
            height: 200px;
            background-color: red;
            position: absolute;
        }

        #japuszko {
            width: 20px;
            height: 20px;
            background-color: greenyellow;
            position: absolute;
        }
    </style>

</head>
