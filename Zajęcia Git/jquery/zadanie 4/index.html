<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
    crossorigin="anonymous"></script>
    <script>
        $(function(){
            $("#naKoniec").click(function(){
                let produkt = $("#produkt").val();
                if(produkt.lenght() > 0){
                    $("#lista").append("<li>" + produkt + "</li>");
                    $("li").last().css("color", "blue")
                    $("#produkt").val("");
                }
            })

            $("#naPoczatek").click(function(){
                let produkt = $("#produkt").val();
                if(produkt.lenght() > 0){
                    $("#lista").append("<li>" + produkt + "</li>");
                    $("li").last().css("color", "green")
                    $("#produkt").val("");
                }
            })

            let isChange = false;
            $("#akcept").change(function(){
                if(this.checked){
                    $("#wyslij").removeAttr('disabled')
                }else{
                    $("#wyslij").attr('disabled', 'disabled')
                }
            })
        })
    </script>
    <title>Document</title>
</head>
<body>
    <ul id="lista">
        <li>Chleb</li>
        <li>Mleko</li>
    </ul>
    <input type="text" id="produkt" placeholder="Nazwa produktu">
    <button id="naKoniec">Dodaj na koniec</button>
    <button id="naPoczatek">Dodaj na początek</button>
    <input type="checkbox" id="akcept">
    <label for="accept">Czy akceptujesz?</label>
    <button id="wyslij" disabled>Wyslij</button>
</body>
</html>
